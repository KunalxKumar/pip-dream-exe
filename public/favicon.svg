  <path d="M46 14 C40 14 36 19 36 26 C36 33 41 38 48 38 C49 38 50 38 51 37.8 C48 40.5 44 42 40 42 C30 42 22 34 22 24 C22 17 26 11 32 9 C30 10.5 29 12 29 14 C29 18 32 21 36 21 C40 21 44 18 46 14 Z" fill="#FCE7A2"/>
  
  <!-- Cute Pip Baby Skull Head -->
